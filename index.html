<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 2026 Bookshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>My 2026 Reading Archive</h1>
            <p>Select a book cover to view my 3D review & tropes.</p>
        </header>

        <!-- 2026 Bookshelf Container -->
        <section class="shelf-section">
            <h2>2026 Favorite Reads</h2>
            
            <div class="bookshelf">
                <!-- Book 1 -->
                <a href="book1.html" class="book-card" title="The Poison Daughter">
                    <img src="images/book1.jpg" alt="The Poison Daughter by Sheila Masterson" class="book-cover">
                </a>

                <!-- Book 2 -->
                <a href="book2.html" class="book-card" title="Divine Rivals">
                    <img src="images/book2.jpg" alt="Divine Rivals by Rebecca Ross" class="book-cover">
                </a>

                <!-- Book 3 -->
                <a href="book3.html" class="book-card" title="Ruthless Vows">
                    <img src="images/book3.jpg" alt="Ruthless Vows by Rebecca Ross" class="book-cover">
                </a>

                <!-- Book 4 -->
                <a href="book4.html" class="book-card" title="One Dark Window">
                    <img src="images/book4.jpg" alt="One Dark Window by Rachel Gillig" class="book-cover">
                </a>

                <!-- Book 5 -->
                <a href="book5.html" class="book-card" title="My Friends">
                    <img src="images/book5.jpg" alt="My Friends by Fredrik Backman" class="book-cover">
                </a>

                <!-- Book 6 -->
                <a href="book6.html" class="book-card" title="Bride">
                    <img src="images/book6.jpg" alt="Bride by Ali Hazelwood" class="book-cover">
                </a>
            </div>
            <!-- Wooden Shelf Base -->
            <div class="shelf-wood"></div>
        </section>
    </div>
</body>
</html>
