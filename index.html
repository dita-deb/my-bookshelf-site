<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 2026 Bookshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>My 2026 Reading Archive</h1>
            <p>Select a book spine to view my 3D review & tropes.</p>
        </header>

        <!-- 2026 Bookshelf Container -->
        <section class="shelf-section">
            <h2>2026</h2>
            
            <div class="bookshelf">
                <!-- Book 1 -->
                <a href="book1.html" class="book-spine spine-1" title="The Poison Daughter">
                    <span class="spine-title">The Poison Daughter</span>
                    <span class="spine-author">Sheila Masterson</span>
                </a>

                <!-- Book 2 -->
                <a href="book2.html" class="book-spine spine-2" title="Divine Rivals">
                    <span class="spine-title">Divine Rivals</span>
                    <span class="spine-author">Rebecca Ross</span>
                </a>

                <!-- Book 3 -->
                <a href="book3.html" class="book-spine spine-3" title="Ruthless Vows">
                    <span class="spine-title">Ruthless Vows</span>
                    <span class="spine-author">Rebecca Ross</span>
                </a>

                <!-- Book 4 -->
                <a href="book4.html" class="book-spine spine-4" title="One Dark Window">
                    <span class="spine-title">One Dark Window</span>
                    <span class="spine-author">Rachel Gillig</span>
                </a>

                <!-- Book 5 -->
                <a href="book5.html" class="book-spine spine-5" title="My Friends">
                    <span class="spine-title">My Friends</span>
                    <span class="spine-author">Fredrik Backman</span>
                </a>

                <!-- Book 6 -->
                <a href="book6.html" class="book-spine spine-6" title="Bride">
                    <span class="spine-title">Bride</span>
                    <span class="spine-author">Ali Hazelwood</span>
                </a>
            </div>
            <!-- Wooden Shelf Base -->
            <div class="shelf-wood"></div>
        </section>
    </div>
</body>
</html>
